name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtimes:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.versions.outputs.node }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: versions
        run: >-
          node --input-type=module -e
          'import { runtimeBaseline } from "./tooling/runtime-baseline.mjs";
          console.log("node=" + JSON.stringify(runtimeBaseline.nodeTestVersions));'
          >> "$GITHUB_OUTPUT"

  check:
    needs: runtimes
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.runtimes.outputs.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI runs full verification directly; local Git hooks would repeat its checks.
      HUSKY: "0"

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install consumer browsers
        run: pnpm exec playwright install --with-deps

      - name: Run repository verification
        run: pnpm check
